!
version 15.1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname R-OSPF-2
!
!
!
!
!
!
!
!
ip cef
no ipv6 cef
!
!
!
!
license udi pid CISCO2811/K9 sn FTX10170WC8
!
!
!
!
!
!
!
!
!
!
!
no ip domain-lookup
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface FastEthernet0/0
 description LAN usuarios
 mac-address 0212.0000.2009
 ip address 192.168.0.1 255.255.255.0
 duplex auto
 speed auto
!
interface FastEthernet0/1
 mac-address 0212.0000.200a
 no ip address
 duplex auto
 speed auto
!
interface Serial0/0/0
 description Hacia R-CENTRAL
 mac-address 0212.0000.200d
 bandwidth 100000
 ip address 10.0.0.9 255.255.255.252
 ip ospf cost 10
 clock rate 64000
!
interface Serial0/0/1
 description Directo R-OSPF-1 ECMP
 mac-address 0212.0000.200e
 bandwidth 100000
 ip address 10.0.0.2 255.255.255.252
 ip ospf cost 20
!
interface Vlan1
 no ip address
!
router ospf 1
 router-id 2.2.2.2
 log-adjacency-changes
 passive-interface default
 no passive-interface Serial0/0/0
 no passive-interface Serial0/0/1
 network 10.0.0.0 0.0.0.15 area 0
 network 192.168.0.0 0.0.0.255 area 0
!
ip classless
!
ip flow-export version 9
!
!
!
!
!
!
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
!
!
end
