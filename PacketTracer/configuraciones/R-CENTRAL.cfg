!
version 15.1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname R-CENTRAL
!
!
!
!
!
!
!
!
ip cef
no ipv6 cef
!
!
!
!
license udi pid CISCO2811/K9 sn FTX10170WC8
!
!
!
!
!
!
!
!
!
!
!
no ip domain-lookup
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface FastEthernet0/0
 mac-address 0212.0000.2021
 no ip address
 duplex auto
 speed auto
!
interface FastEthernet0/1
 mac-address 0212.0000.2022
 no ip address
 duplex auto
 speed auto
!
interface Serial0/0/0
 description OSPF-1
 mac-address 0212.0000.2025
 bandwidth 100000
 ip address 10.0.0.6 255.255.255.252
 ip ospf cost 10
!
interface Serial0/0/1
 description OSPF-2
 mac-address 0212.0000.2026
 bandwidth 100000
 ip address 10.0.0.10 255.255.255.252
 ip ospf cost 10
!
interface Serial0/1/0
 description EIGRP-1
 mac-address 0212.0000.2029
 bandwidth 100000
 ip address 10.0.0.18 255.255.255.252
 delay 1
 ip summary-address eigrp 100 192.168.0.0 255.255.254.0 5
!
interface Serial0/1/1
 description EIGRP-2
 mac-address 0212.0000.202a
 bandwidth 100000
 ip address 10.0.0.22 255.255.255.252
 delay 1
 ip summary-address eigrp 100 192.168.0.0 255.255.254.0 5
!
interface Vlan1
 no ip address
!
router eigrp 100
 redistribute ospf 1 metric 100000 10 255 1 1500 
 network 10.0.0.16 0.0.0.3
 network 10.0.0.20 0.0.0.3
!
router ospf 1
 router-id 5.5.5.5
 log-adjacency-changes
 redistribute eigrp 100 metric-type 1 
 redistribute static metric-type 1 subnets 
 network 10.0.0.4 0.0.0.3 area 0
 network 10.0.0.8 0.0.0.3 area 0
!
ip classless
ip route 172.16.0.0 255.255.255.0 Null0 
!
ip flow-export version 9
!
!
access-list 10 permit 192.168.0.0 0.0.1.255
access-list 20 permit 172.16.0.0 0.0.0.255
!
!
!
!
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
!
!
end
