!
version 15.1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname R-OSPF-1
!
!
!
!
!
!
!
!
ip cef
no ipv6 cef
!
!
!
!
license udi pid CISCO2811/K9 sn FTX10170WC8
!
!
!
!
!
!
!
!
!
!
!
no ip domain-lookup
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface FastEthernet0/0
 description Trunk hacia switch de acceso
 mac-address 0212.0000.2001
 no ip address
 duplex auto
 speed auto
!
interface FastEthernet0/0.10
 description VLAN 10
 encapsulation dot1Q 10
 ip address 192.168.1.1 255.255.255.192
!
interface FastEthernet0/0.30
 description VLAN 30
 encapsulation dot1Q 30
 ip address 192.168.1.65 255.255.255.240
!
interface FastEthernet0/1
 mac-address 0212.0000.2002
 no ip address
 duplex auto
 speed auto
!
interface Serial0/0/0
 description Hacia R-CENTRAL
 mac-address 0212.0000.2005
 bandwidth 100000
 ip address 10.0.0.5 255.255.255.252
 ip ospf cost 10
 clock rate 64000
!
interface Serial0/0/1
 description Directo R-OSPF-2 ECMP
 mac-address 0212.0000.2006
 bandwidth 100000
 ip address 10.0.0.1 255.255.255.252
 ip ospf cost 20
 clock rate 64000
!
interface Vlan1
 no ip address
!
router ospf 1
 router-id 1.1.1.1
 log-adjacency-changes
 passive-interface default
 no passive-interface Serial0/0/0
 no passive-interface Serial0/0/1
 network 10.0.0.0 0.0.0.7 area 0
 network 192.168.1.0 0.0.0.255 area 0
!
ip classless
!
ip flow-export version 9
!
!
!
!
!
!
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
!
!
end
