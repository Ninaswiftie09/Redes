!
version 15.1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname R-EIGRP-2
!
!
!
!
!
!
!
!
ip cef
no ipv6 cef
!
!
!
!
license udi pid CISCO2811/K9 sn FTX10170WC8
!
!
!
!
!
!
!
!
!
!
!
no ip domain-lookup
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface FastEthernet0/0
 description LAN usuarios
 mac-address 0212.0000.2019
 ip address 172.16.0.1 255.255.255.128
 duplex auto
 speed auto
!
interface FastEthernet0/1
 mac-address 0212.0000.201a
 no ip address
 duplex auto
 speed auto
!
interface Serial0/0/0
 description Secundario via CENTRAL 25pct
 mac-address 0212.0000.201d
 bandwidth 100000
 ip address 10.0.0.21 255.255.255.252
 delay 3219
 clock rate 64000
!
interface Serial0/0/1
 description Principal directo 75pct
 mac-address 0212.0000.201e
 bandwidth 100000
 ip address 10.0.0.14 255.255.255.252
 delay 1000
!
interface Vlan1
 no ip address
!
router eigrp 100
 variance 4
 passive-interface default
 no passive-interface Serial0/0/0
 no passive-interface Serial0/0/1
 network 172.16.0.0 0.0.0.255
 network 10.0.0.0 0.0.0.31
!
ip classless
!
ip flow-export version 9
!
!
!
!
!
!
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
!
!
end
